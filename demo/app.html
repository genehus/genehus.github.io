<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeneHus Clinician Demo — Sample cases</title>
  <meta name="description" content="GeneHus hospital dashboard preview. Sample patients only. Not for clinical use.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.ico?v=2" sizes="any">
  <link rel="icon" href="/assets/favicon.png?v=2" type="image/png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/demo/demo.css?v=20260823sticky">
</head>
<body>
  <div class="banner" role="note">
    Sample data. Preview only. Not for clinical use. Not validated. Not Ghana FDA approved. Working v1 is not built yet.
  </div>

  <div id="app" class="app">
    <header class="topbar">
      <a class="brand" href="https://genehus.bio/">
        <img src="/assets/genehus-logo-b5.png" alt="GeneHus" width="160" height="40">
        <span class="brand-name">GeneHus</span>
      </a>
      <div class="topbar-mid">
        <strong>Sample hospital ward</strong>
        <span>Demo · sample cases only</span>
      </div>
      <div class="topbar-right">
        <span class="role-pill">Clinician preview</span>
        <a class="text-link" href="/demo/">Back</a>
      </div>
    </header>

    <div class="layout">
      <aside class="queue">
        <div class="queue-head">
          <h2>Who to see first</h2>
          <p>Ranked sample list. Highest combined risk at the top.</p>
        </div>
        <ol id="queue-list" class="queue-list"></ol>
        <button class="btn btn-ghost" id="new-case-btn" type="button">New sample case</button>
      </aside>

      <main class="case" id="case-panel">
        <p class="empty-hint">Loading sample cases…</p>
      </main>
    </div>
  </div>

  <script src="/demo/demo.js?v=20260823sticky"></script>
</body>
</html>
